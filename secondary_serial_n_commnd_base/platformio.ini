; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries

; --- SERIAL MONITOR SETTINGS ---
; Set the specific COM / Serial port
monitor_port = /dev/ttyUSB1   ; Linux / macOS
; Set the baud rate (must match Serial.begin() in your code)
monitor_speed = 115200
; Set parity (N = None, E = Even, O = Odd, M = Mark, S = Space)
monitor_parity = N
; Set hardware flow control (RTS/CTS) or software flow control (XON/XOFF)
monitor_rts = 0
monitor_dtr = 0
monitor_filters = default, log2file

